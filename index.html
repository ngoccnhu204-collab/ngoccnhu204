<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Climate Smart City - WebGIS</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #198754;
            color: white;
            padding: 18px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .card h3 {
            margin-top: 0;
        }

        .map-section {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
        }

        .buttons {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            margin-right: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #198754;
            color: white;
        }

        button:hover {
            background: #146c43;
        }

        .chart-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌍 Climate Smart City - WebGIS</h1>
    <p>WebGIS quản lý dữ liệu khí hậu đô thị</p>
</header>

<div class="container">

    <!-- THỐNG KÊ -->
    <div class="stats">

        <div class="card">
            <h3>🌡️ Nhiệt độ</h3>
            <h2>26.5 °C</h2>
        </div>

        <div class="card">
            <h3>💧 Độ ẩm</h3>
            <h2>72%</h2>
        </div>

        <div class="card">
            <h3>🌳 Cây xanh</h3>
            <h2>12,450</h2>
        </div>

        <div class="card">
            <h3>⚡ Năng lượng</h3>
            <h2>4.2 MW</h2>
        </div>

    </div>

    <!-- BẢN ĐỒ -->
    <div class="map-section">

        <h2>🗺️ Bản đồ khí hậu</h2>

        <div class="buttons">
            <button onclick="showTemperature()">
                🌡️ Nhiệt độ
            </button>

            <button onclick="showHumidity()">
                💧 Độ ẩm
            </button>

            <button onclick="showTrees()">
                🌳 Cây xanh
            </button>
        </div>

        <div id="map"></div>

    </div>

    <!-- BIỂU ĐỒ -->
    <div class="chart-section">

        <h2>📊 Nhiệt độ trung bình theo tháng</h2>

        <canvas id="temperatureChart"></canvas>

    </div>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // =========================
    // KHỞI TẠO BẢN ĐỒ
    // =========================

    const map = L.map('map').setView(
        [21.0285, 105.8542],
        12
    );

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    // =========================
    // DỮ LIỆU DEMO
    // =========================

    const locations = [

        {
            name: "Điểm quan trắc Hà Nội",
            lat: 21.0285,
            lng: 105.8542,
            temperature: 26.5,
            humidity: 72
        },

        {
            name: "Điểm quan trắc Cầu Giấy",
            lat: 21.0367,
            lng: 105.7906,
            temperature: 27.2,
            humidity: 70
        },

        {
            name: "Điểm quan trắc Hoàn Kiếm",
            lat: 21.0288,
            lng: 105.8525,
            temperature: 26.8,
            humidity: 74
        }

    ];


    // =========================
    // HIỂN THỊ ĐIỂM
    // =========================

    locations.forEach(point => {

        L.marker([
            point.lat,
            point.lng
        ])
        .addTo(map)

        .bindPopup(`
            <b>${point.name}</b><br>
            🌡️ Nhiệt độ: ${point.temperature} °C<br>
            💧 Độ ẩm: ${point.humidity} %
        `);

    });


    // =========================
    // NÚT LỚP DỮ LIỆU
    // =========================

    function showTemperature() {

        alert(
            "Đang hiển thị lớp dữ liệu nhiệt độ 🌡️"
        );

    }

    function showHumidity() {

        alert(
            "Đang hiển thị lớp dữ liệu độ ẩm 💧"
        );

    }

    function showTrees() {

        alert(
            "Đang hiển thị lớp dữ liệu cây xanh 🌳"
        );

    }


    // =========================
    // BIỂU ĐỒ
    // =========================

    const ctx =
        document.getElementById(
            'temperatureChart'
        );

    new Chart(ctx, {

        type: 'line',

        data: {

            labels: [
                'Tháng 1',
                'Tháng 2',
                'Tháng 3',
                'Tháng 4',
                'Tháng 5',
                'Tháng 6'
            ],

            datasets: [{

                label: 'Nhiệt độ (°C)',

                data: [
                    20.1,
                    21.5,
                    23.8,
                    26.2,
                    28.0,
                    28.5
                ],

                borderWidth: 3,

                tension: 0.3

            }]

        },

        options: {

            responsive: true,

            scales: {

                y: {

                    beginAtZero: false

                }

            }

        }

    });

</script>

</body>
</html>
